[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ware-ops-pipes"
version = "0.1.0"
description = "Context-aware synthesis of optimization pipelines for warehouse optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ware-ops-algos @ git+https://github.com/kit-dsm/ware_ops_algos.git@4d928e7f605b2be78353958d2f523d7309f98966",
    "cls-luigi==0.1.1",
    "luigi==3.6.0",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
eval = [
    "jupyter",
    "tqdm",
    "orjson",
    "seaborn",
    "jinja2",
    "lxml",
    "pyarrow"
]
docs = [
    "sphinx",
    "sphinx-copybutton",
    "furo",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
