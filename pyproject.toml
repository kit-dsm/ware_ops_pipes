[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ware-ops-pipes"
version = "0.1.0"
description = "Pipeline tool to build and run automated warehouse optimization."
requires-python = "==3.13.*"
license = { file = "LICENSE" }
dependencies = [
    "ware-ops-algos @ git+https://github.com/kit-dsm/ware_ops_algos.git@042dcff65c1fe0f11c8659c2977dd42c3f079982",
    "cls-luigi==0.1.1",
    "luigi==3.6.0",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
eval = [
    "jupyter",
    "tqdm",
    "orjson",
    "seaborn",
    "jinja2",
    "lxml",
    "pyarrow"
]
docs = [
    "sphinx",
    "sphinx-design",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "furo",
    "myst-nb",
    "nbsphinx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
